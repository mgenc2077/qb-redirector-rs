[package]
name = "qb-redirector-rs"
version = "0.1.0"
edition = "2024"
description = "Torrent router that sends torrents to one of several qBittorrent instances"
repository = "https://github.com/mgenc2077/qb-redirector-rs"
license = "GPL-3.0-only"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "multipart", "cookies", "rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "6"
